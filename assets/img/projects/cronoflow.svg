<svg viewBox="0 0 700 438" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1">
  <title id="t1">cronoflow — time and workflow automation app</title>
  <defs>
    <pattern id="stripesCF" width="11" height="11" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" fill="#0d0d0d"/>
      <line x1="0" y1="0" x2="0" y2="11" stroke="#1f1f1f" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="700" height="438" fill="url(#stripesCF)"/>
  <rect width="700" height="438" fill="#0d0d0d" fill-opacity="0.35"/>

  <!-- application window frame -->
  <rect x="234" y="80" width="232" height="270" rx="6" fill="#161616" stroke="#3a3a3a" stroke-width="3"/>

  <!-- window title bar -->
  <rect x="234" y="80" width="232" height="26" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="3"/>
  <rect x="234" y="94" width="232" height="12" fill="#1a1a1a"/>
  <circle cx="250" cy="93" r="4" fill="#3a3a3a"/>
  <circle cx="264" cy="93" r="4" fill="#3a3a3a"/>
  <circle cx="278" cy="93" r="4" fill="#3a3a3a"/>

  <!-- window content area -->
  <rect x="250" y="122" width="200" height="212" rx="4" fill="#101010"/>

  <!-- app top bar inside content -->
  <rect x="250" y="122" width="200" height="30" fill="#1f9a4c" fill-opacity="0.25"/>
  <line x1="262" y1="137" x2="330" y2="137" stroke="#39ff7a" stroke-width="3" stroke-linecap="round"/>

  <!-- schedule rows referencing time blocks -->
  <rect x="262" y="168" width="176" height="18" rx="3" fill="#232323"/>
  <rect x="262" y="196" width="176" height="18" rx="3" fill="#232323"/>
  <rect x="262" y="224" width="176" height="18" rx="3" fill="#232323"/>
  <line x1="270" y1="177" x2="304" y2="177" stroke="#39ff7a" stroke-width="2"/>
  <line x1="270" y1="205" x2="322" y2="205" stroke="#808080" stroke-width="2"/>
  <line x1="270" y1="233" x2="312" y2="233" stroke="#808080" stroke-width="2"/>

  <!-- clock badge, large accent -->
  <circle cx="480" cy="200" r="66" fill="#0d0d0d" fill-opacity="0.6" stroke="#39ff7a" stroke-width="3"/>
  <line x1="480" y1="200" x2="480" y2="160" stroke="#39ff7a" stroke-width="6" stroke-linecap="round"/>
  <line x1="480" y1="200" x2="508" y2="214" stroke="#39ff7a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="480" cy="200" r="5" fill="#39ff7a"/>

  <!-- flow line: sequential process steps -->
  <polyline points="150,300 200,300 218,282 236,300 300,300" fill="none" stroke="#e5e5e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="300" r="4" fill="#e5e5e5"/>
  <circle cx="236" cy="300" r="4" fill="#e5e5e5"/>
  <circle cx="300" cy="300" r="4" fill="#39ff7a"/>
</svg>
